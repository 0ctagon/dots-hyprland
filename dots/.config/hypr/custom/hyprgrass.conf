# Hyprgrass Touch Gesture Configuration
# Add this to your hyprland.conf or source it

plugin {
    touch_gestures {
        # Basic sensitivity - increase for tablet screens (default: 1.0, recommended for tablets: 4.0)
        sensitivity = 4.0

        # Number of fingers for workspace switching (minimum 3)
        workspace_swipe_fingers = 3

    }
    gestures {
        workspace_swipe = true
        workspace_swipe_cancel_ratio = 0.15
    }
    touch_gestures {
        hyprgrass-gesture = swipe, 3, down, close
    }
}